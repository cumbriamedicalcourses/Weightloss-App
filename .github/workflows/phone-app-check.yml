# Builds the phone apps whenever they change, to catch mistakes early.
# The Android build is a test copy (an .apk) that can be put straight on an
# Android phone: open the run on GitHub and download "android-test-app".
# Store builds are made by Codemagic instead (see codemagic.yaml).
name: Phone app check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/phone-app-check.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: mobile
        run: npm ci && npx cap sync android
      - name: Build
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-app
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iPhone app compiles
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: mobile
        run: npm ci && npx cap sync ios
      - name: Build for the simulator (no signing)
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40; exit ${PIPESTATUS[0]}
