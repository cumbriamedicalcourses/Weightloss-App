# Builds the Android app whenever the phone apps change, to catch mistakes early.
# The Android build is a test copy (an .apk) that can be put straight on an
# Android phone: open the run on GitHub and download "android-test-app".
# The iPhone app is built by Codemagic, which has Macs (see codemagic.yaml).
# Store builds of both apps are made there too.
name: Phone app check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/phone-app-check.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: mobile
        run: npm ci && npx cap sync android
      - name: Build
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-app
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

